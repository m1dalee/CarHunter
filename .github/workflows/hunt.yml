name: Car Hunter

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  hunt-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore seen listings (AutoScout24)
        uses: actions/cache@v4
        with:
          path: data/seen.json
          key: car-hunter-seen-autoscout-v1

      - run: npm ci

      - name: Run car hunt (AutoScout24)
        run: npm run hunt
        env:
          HUNT_SITES: autoscout24
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  hunt-browser:
    runs-on: [self-hosted, Windows, car-hunter]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore persistent data
        shell: pwsh
        run: |
          $base = "C:\CarHunter"
          New-Item -ItemType Directory -Force -Path "$base\data" | Out-Null
          if (Test-Path "$base\.env") { Copy-Item "$base\.env" .env }
          if (Test-Path "$base\data\seen.json") {
            New-Item -ItemType Directory -Force -Path data | Out-Null
            Copy-Item "$base\data\seen.json" data\seen.json
          }

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Install Playwright Chromium
        shell: cmd
        run: npx playwright install chromium

      - name: Run car hunt (leboncoin, La Centrale, mobile.de)
        shell: cmd
        run: npm run hunt
        env:
          HUNT_SITES: leboncoin,lacentrale,mobilede
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save persistent data
        if: always()
        shell: pwsh
        run: |
          $base = "C:\CarHunter"
          New-Item -ItemType Directory -Force -Path "$base\data" | Out-Null
          if (Test-Path .env) { Copy-Item .env "$base\.env" -Force }
          if (Test-Path data\seen.json) { Copy-Item data\seen.json "$base\data\seen.json" -Force }
